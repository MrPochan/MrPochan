# /etc/nginx/sites-available/roadflow.ru
# Static files from /var/www/roadflow, the API from the Node server on 127.0.0.1:3000.
# Start with this HTTP-only file, then run `certbot --nginx -d roadflow.ru -d www.roadflow.ru`:
# certbot adds the HTTPS server block with the same locations and redirects HTTP to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name roadflow.ru www.roadflow.ru;

    root /var/www/roadflow;
    index index.html;
    client_max_body_size 64k;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    if ($host = www.roadflow.ru) { return 301 $scheme://roadflow.ru$request_uri; }

    # main page
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # API for the site and the game
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # only the Telegram bot talks to /internal, from the same machine
    location /internal/ { return 404; }

    # the game: nginx asks the server whether the visitor is logged in before it serves a single file
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /play { return 301 /play/; }
    location /play/ {
        auth_request /_auth;
        error_page 401 = @to_login;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /play/index.html;
    }
    location @to_login { return 302 /#login; }

    location / {
        try_files $uri =404;
    }
}
